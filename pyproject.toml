[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pacxio"
version = "0.0.2"
description = "Packaging prepress for coding agents: dielines, 3D, print-ready factory files"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "shapely>=2.1",
    "ezdxf>=1.3",
    "reportlab>=4.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "fonttools>=4.50",
    "pikepdf>=9.0",
]

[project.scripts]
pacxio = "pacxio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-shapely",
    "types-reportlab",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pacxio"]

# 配置档随包安装（Skill 用 `uv tool install` 装成独立命令，找不到源码仓库的 profiles/）
[tool.hatch.build.targets.wheel.force-include]
"profiles" = "pacxio/_profiles"
"conventions" = "pacxio/_conventions"
"skill/packaging-prepress" = "pacxio/_skill/packaging-prepress"  # MCP 资源：给没装 Skill 的 agent 读流程

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "pro/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 中文注释/文案按显示宽度计 2 列，E501 对其误报过多；行宽由 ruff format 约束
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pacxio", "pacxio_pro"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# 开源代码只在用到时导入闭源包；开源仓库里没有它，类型按未知处理（）
[[tool.mypy.overrides]]
module = ["pacxio_pro", "pacxio_pro.*"]
ignore_missing_imports = true

# uharfbuzz / fontTools 没有类型存根
[[tool.mypy.overrides]]
module = ["uharfbuzz", "fontTools.*", "svgelements"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pacxio_pro.layout.text"]
disallow_subclassing_any = false
