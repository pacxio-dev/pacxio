# English for the structure catalogue (spec : the website is bilingual zh / en).
# Our own descriptive wording — not the FEFCO / ECMA catalogue text.
# Descriptions drop the trailing "——按示意图推读[，待核对]" note; engine/i18n.py adds the English note back.

series:
  "01": Sheets and rolls
  "02": Slotted cases
  "03": Telescope boxes (lid and base, caps)
  "04": Folders and trays
  "05": Slide boxes (sleeves, cross sleeves)
  "06": Rigid-type boxes (body + end panels)
  "07": Ready-glued cases (crash lock, pre-glued trays)
  "08": Display (shelf trays, stands, headers)
  "09": Interior fitments (dividers, inserts, corner guards)
  "A": Folding cartons (ECMA A, tube with side glue flap)
  "C": Common combinations

catalog:
  FEFCO: FEFCO
  ECMA: ECMA
  组合: Combination

maturity:
  calibrated: Calibrated
  standard: "Standard (read from the catalogue drawing, values are initial)"
  custom: "Custom (common combination, proportions from samples / descriptions, values are initial)"

tags:
  三片式: three-piece
  免胶: no glue
  免胶带: no tape
  内衬: insert
  反复开合: reclosable
  多件: multi-part
  头卡: header card
  展示: display
  展示盖: display lid
  常用组合: common combination
  开孔: holes
  开窗: window
  彩盒: folding carton
  托盒: tray
  扣: lock
  拉手: pull tab
  挂孔: hang hole
  提手: handle
  撕开: tear open
  撕开窗: tear-off window
  易开: easy open
  电商: e-commerce
  礼盒: gift box
  翻盖: hinged lid
  运输: shipping
  零食: snacks
  食品: food

# Closure fragments (the catalogue joins them as "top: …; bottom: …")
closure:
  两头盖帽套合: caps on both ends
  侧插盖: side tuck
  切角: cut corners
  包裹式: wrap-around
  双层墙 + 耳朵（免胶）: double walls + ears (no glue)
  墙角不连（胶带 / 钉）: open corners (tape / staples)
  套合（天地盖 / 两件套）: telescope (lid and base / two pieces)
  套筒交叉 / 抽屉式: cross sleeves / drawer
  开口: open
  开顶: open top
  扣底（免胶带）: 1-2-3 snap bottom (no tape)
  挂板 + 插舌盖: hanger panel + tuck lid
  挂板 / 展示板 + 盖: hanger / display panel + lid
  提手山形顶: gable top with handle
  提手平顶: flat top with handle
  插舌盖: tuck lid
  插舌盖 + 撕拉条（一次性开箱）: tuck lid + tear strip (one-time opening)
  摇盖（胶带 / 胶 / 钉）: flaps (tape / glue / staples)
  斜口展示（开顶）: sloped display opening (open top)
  片材（折叠 / 插接，不用封）: sheet (folded / slotted, no closing)
  盖 + 粘翼: lid + glued flaps
  窄边框: narrow frame
  组件（各件插接 / 装配）: kit (parts slot / assemble together)
  缩小翼（粘）: reduced flaps (glued)
  自动锁底（撑开成型、免胶带）: crash-lock bottom (pops open, no tape)
  自锁底（摇盖互扣）: self-locking bottom (interlocking flaps)
  角翼（不糊，靠盖侧翼压住）: corner flaps (unglued, held by the lid side flaps)
  角翼（粘）: glued corner flaps
  角翼（粘 / 钉）: corner flaps (glued / stapled)
  多边形托盘: polygonal tray
  连盖插舌: hinged lid with tuck
  连盖（前翼盖在外面）: hinged lid (front flap closes outside)
  连盖（回折内衬 + 锁舌）: hinged lid (folded-back liner + locking tabs)
  连盖（远边平）: hinged lid (flat far edge)
  两侧翼锁舌扣底（免胶）: side-flap locking tabs (no glue)
  齿线撕开窗: perforated tear-off window
  展示盖压外面（胶条粘住，第一次撕开后立起当头卡）: display lid on the outside (glue strip; after first opening it stands up as a header card)
  "连盖（远边平） + 两侧翼锁舌扣底（免胶） + 齿线撕开窗 + 展示盖压外面（胶条粘住，第一次撕开后立起当头卡）": "hinged lid (flat far edge) + side-flap locking tabs (no glue) + perforated tear-off window + display lid on the outside (glue strip; after first opening it stands up as a header card)"
  连盖（锁舌插槽）: hinged lid (tab into slot)
  连角（预糊、压扁出厂）: pre-glued corners (ships flat)
  锁舌摇盖: locking flaps
  长条包裹: strip wrap
  隔板摇盖（要胶带）: divider flaps (needs tape)
  飞机盒：双层侧墙 + 耳朵，连盖插舌（免胶）: "mailer: double side walls + ears, hinged lid with tuck (no glue)"

closure_prefix:
  顶: top
  底: bottom

