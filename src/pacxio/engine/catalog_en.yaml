combos:
  tear_display_tray:
    name: Tear-open display lid tray
    description: "Folding-carton tray: the top hinges on one wall with a perforated tear-off window in the middle, side flaps glue outside the side walls and their locking tabs go into slots on the base / side-wall crease (no glue on the sides); a display lid hinged on the opposite wall lies on the outside, held by a glue strip at the window edge — on first opening the window tears away and the display lid stands up as a header card; rounded far corners and a half-round easy-open pull in the middle of the display lid (the pull stays inside the lid, total = box width, nothing sticks out); rounded window corners; rounded free corners"

