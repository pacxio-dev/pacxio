? 'pacxio: packaging design to factory files (dieline, print PDF, finish separations, preflight report). Read the resource pacxio://skill/SKILL.md first (workflow, hard rules). Call job_next before every round of work; let the user view, comment and confirm on the workbench (studio_open). Hard rules: only the user confirms — use user_confirm (with their words) only after the user clearly says so in the conversation; with preflight / export errors there are no factory files; text in print files is set by the engine; concept images are never assets; concept gen / visual gen spend the user''s image credits, say so first. Structures: structures_suggest picks from the catalog; state maturity honestly (proof first for non-calibrated ones). When CLOUD_LOGIN comes back, give the user the address and code as they are; the user signs in and clicks Approve in the browser (the agent never clicks for them), then rerun the same command. Other commands go through pacxio_run (call pacxio_help first if unsure
  of the arguments).'
: pacxio：包装设计到工厂文件（刀版、印刷 PDF、工艺分版、检查报告），全部在本机算。先读资源 pacxio://skill/SKILL.md（流程、铁律）。每一轮动手前先 job_next；让用户在工作台看图、批注、确认（studio_open）。铁律：确认只能是用户做——用户在对话里明确说确认后才用 user_confirm（填原话）；preflight / export 有 error 就不是工厂文件；印刷文件里的字由引擎排；概念图不能当素材；concept gen / visual gen 花用户的出图额度，先说。结构：structures_suggest 从目录挑方案，成熟度如实说（非已校准的建议先打样）。返回 CLOUD_LOGIN 时把网址和代码原样给用户，由用户本人在浏览器登录、点 Approve（agent 不替用户点），之后重跑同一条命令。其余命令用 pacxio_run（不知道参数先 pacxio_help）。
pacxio_help without arguments lists every command: pacxio_help 不带参数列出全部命令
