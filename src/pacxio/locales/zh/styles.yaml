'{part}: ear_depth={depth:.1f} is too large. The ears will collide inside the end wall (maximum {maximum:.1f}).': '{part}：ear_depth={depth:.1f}
  太深，两头的耳朵会在端壁里相撞（≤ {maximum:.1f}）'
'{part}: the ear''s free end is only {height:.1f} mm high (minimum {minimum:g})': '{part}：耳朵自由端只有 {height:.1f} mm 高（至少 {minimum:g}）'
'{part}: the locking tab does not fit in an inner wall only {width:.1f} mm wide': '{part}：插脚放不下（内壁只有 {width:.1f} mm 宽）'
'{part}: the rollover is too wide and leaves no positive inner wall height': '{part}：卷边太宽，内壁高度非正'
? '{part}: wall height {height:.1f} mm leaves too little room for the ear (depth at least {min_depth:g}, free end at least
  {min_free:g}, provisional)'
: '{part}：壁太矮（{height:.1f} mm），耳朵放不下（深至少 {min_depth:g}、自由端至少 {min_free:g}）【初值】'
'{part}: {parameter}={value:.2f} is outside the provisional range {minimum:.2f}–{maximum:.2f}': '{part}：{parameter}={value:.2f}
  超出 {minimum:.2f}–{maximum:.2f}【初值】'
'{style} is a corrugated style. The current material type is {material}.': '{style} 是瓦楞盒型，当前材料类型为 {material}'
'{style} normally uses {usual} flute. This job uses {flute} flute (provisional guidance).': '{style}一般用 {usual} 楞，现在是 {flute}
  楞【初值】'
'{style} supports {supported}. The current material type is {material}.': '{style} 只支持 {supported}，当前材料类型为 {material}'
'{style}: {parameter}={value} is below the provisional minimum {minimum}': '{style}：{parameter}={value} 小于下限 {minimum}【初值】'

"PDF forms are nested too deeply": "PDF Form 嵌套过深"
"The reference PDF contains non-finite coordinates": "参考 PDF 包含非有限坐标"
"The PDF graphics state stack is unbalanced": "PDF 图形状态栈不匹配"
"A PDF line operator has no starting point": "PDF l 缺少 m"
"A PDF curve has no starting point": "PDF 曲线缺少起点"
"A coloured dieline uses a clipping path. Flatten the PDF clipping before calibrating": "有色刀线受裁切路径影响，须先展开 PDF 裁切"
"The cut and crease colours cannot be distinguished": "刀线 / 压线颜色无法区分"
"The reference PDF must contain one page and one dieline": "参考 PDF 须只有一页 / 一个刀版"
"The PDF page inheritance tree is too deep": "PDF 页面继承层级过深"
"Apply the page rotation to the PDF content first. Calibration does not rotate the reference": "先展开 PDF 页面旋转；工具不自动旋转对齐"
"No vector cut lines matched the cut colour in the reference. Bitmap or black-and-white references cannot be detected automatically": "参考中未找到红色矢量刀线（位图 / 黑白 PDF 不能自动识别）"
"Tolerance must be a finite positive number": "容差须为有限正数"
"--size requires positive dimensions in LxWxH format": "--size 须为 LxWxH 正尺寸"
"An unrecognised box style parameter was supplied": "存在未知盒型参数"
"--part is not available for single-piece styles": "单部件盒型不接受 --part"
"Alignment uses translation only. Sampled reference curves do not become production cut lines. A synthetic reference does not establish L1 or change the physical verification status": "仅平移对齐；参考曲线采样不进入生产刀线；合成参考不等于 L1，未改变实物验证标记"
"The reference differs from the generated dieline by more than the tolerance": "参考与生成刀版差异超过容差"
"Inspect the overlay and the distances in both directions for each line type. Check the dimensions, board, parameters and reference orientation first": "查看叠图与分线型双向距离；先确认尺寸、材料、参数与参考方向"
"Check the local vector reference, dimensions, board, line colours and part. Use a vector dieline at a known scale": "检查本地矢量参考、尺寸、材料、线色和部件；不要使用位图 / 不明比例刀版"
"For a multi-part style, use --part to select one of {parts}": "多部件盒型须用 --part 选择 {parts}"
"The {key} line type is missing; calibration cannot pass": "{key} 线型缺失，不能声称校准通过"
