"Running version {version}. Automatic checks run in the background when the plugin starts.": "当前运行版本 {version}。插件启动时会在后台检查更新。"
"Automatic updates are off for this installation; the installed version remains available.": "当前安装方式未启用自动更新，可以继续使用已安装版本。"
"The update check or installation failed. Continue using the working version; another check will run at the next plugin startup.": "检查或安装更新失败，继续使用可用版本；下次启动插件时会再次检查。"
"Version {version} is ready and will be used on a later startup. This session keeps version {current}.": "版本 {version} 已准备好，将在后续启动时使用。本次会话继续使用版本 {current}。"
"Checking or preparing an update in the background. This session keeps version {version}.": "正在后台检查或准备更新，本次会话继续使用版本 {version}。"
"Packaged installs check for updates in the background at each MCP startup; ready updates apply on a later startup, failures keep the working version, and current sessions keep their version. Source/development installs do not auto-update.": "正式安装版在每次 MCP 启动时后台检查更新；准备好的更新在后续启动生效，失败时保留可用版本，当前会话保持原版本。源码或开发安装不自动更新。"
"The plugin checks for updates in the background at startup. This session stays on one version. Read the full Skill from this server's resources, and use its MCP tools to keep workflow and code versions together. Use pacxio_update_status to report a ready update or a failed check; neither requires interrupting the user's current task.": "插件启动时会在后台检查更新，本次会话保持同一个版本。从当前服务的资源读取完整 Skill，并使用它的 MCP 工具，保持流程与代码版本一致。通过 pacxio_update_status 告知用户更新已就绪或检查失败，无需中断用户当前任务。"
"Read automatic update status: running version, prepared version and whether a later startup will use it. Local only; does not start a check or upgrade.": "读取自动更新状态：运行版本、已准备好的版本，以及后续启动是否使用新版。仅查询本地状态，不发起检查或升级。"
"Automatic update status": "自动更新状态"
"Show the running version and any prepared update without contacting the network.": "显示运行版本和已准备好的更新，不访问网络。"
"Serve MCP tools (structures, workflow commands, confirmations) over stdin / stdout, JSON-RPC 2.0, one message per line. Packaged plugins check for updates in the background.": "通过标准输入输出提供 MCP 工具（结构、流程命令和确认），使用 JSON-RPC 2.0，每行一条消息。正式安装的插件会在后台检查更新。"
"This Workbench is still using version {old}; this session uses {new}. Keep it open while the current task is running, then stop and reopen it to use the new version.": "这个工作台仍使用版本 {old}，当前会话使用版本 {new}。当前任务进行中请保持工作台运行，任务结束后停止并重新打开即可使用新版。"
