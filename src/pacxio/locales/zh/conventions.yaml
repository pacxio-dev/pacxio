"Home improvement · Paint": "家居建材 · 涂料"
"Folding cartons and shipping cases for wall paint, wood finishes and primers": "墙面漆、木器漆、底漆等涂料的彩盒与外箱"
"Matching front and back": "正反同款"
"Key visual, brand, product name, category / colour and sheen, volume, main selling points": "主视觉、品牌、品名、品类 / 颜色光泽、容量、主要卖点"
"Same as the front": "与正面相同"
"Use one side for application instructions and technical data. Use the other for precautions, applicable standards, manufacturer, barcode and country of origin. Vertical branding is also common.": "一侧放施工说明与技术参数，另一侧放注意事项、执行标准、生产商、条码、产地；也常把品牌竖排放在侧面"
"Shipping cases, cartons for large paint containers, and products displayed with either face outward": "外箱、大容量涂料的彩盒、货架上正反两面都可能朝外的商品"
"Different roles for front and back": "正背分工"
"Brand story or product introduction, application steps and technical data": "品牌故事 / 产品介绍、施工步骤、技术参数"
"Precautions, applicable standards, manufacturer, barcode and country of origin. Use the other side for the brand or tagline.": "注意事项、执行标准、生产商、条码、产地；另一侧品牌或口号"
"Small retail cartons and gift boxes": "零售小盒、礼盒"
"For paint packaging, check the applicable marking standard in the target market (for example, GB/T 9750 in China). Verify requirements for product name and model, applicable standards, net contents, production date or batch, manufacturer name and address, storage and safety information.": "涂料产品的包装标志有国家标准（如 GB/T 9750《涂料产品包装标志》），通常涉及产品名称、型号、执行标准、净含量、生产日期 / 批号、生产商名称与地址、贮存和安全注意事项等；以现行标准为准。"
"Check whether the target market requires packaging disclosures about hazardous substance limits for architectural coatings and wood finishes.": "建筑涂料、木器涂料有有害物质限量的国家标准，是否需要在包装上标注相关信息，请按产品与销售市场确认。"
"Net contents usually appear on the principal display panel. Check the target market’s requirements for placement and character height.": "净含量通常放在正面（主展示面），并要求一定的字高；请按销售市场的法规确认。"
"Leave sufficient quiet zones around the barcode, use a white or light background, and keep it clear of folds.": "条码需要白底（或浅色底）与足够的静区，位置避开折线。"
"Batch codes and production dates are usually added after printing. Reserve blank space for them in the artwork.": "批号、生产日期通常是印后喷码：版面上只留空白位，不印具体内容。"
"Invalid category reference {path}: {error}": "常规参考表 {path} 无效：{error}"
"Category reference {id} not found. Available: {available}": "找不到常规参考表 {id}（可用：{available}）"
