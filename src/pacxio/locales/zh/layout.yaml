# 排版（layout/*）的提示：进刀版确认图、检查报告（交付件语言）
"Panel {panel} of placement {id} does not exist": "放置 {id} 的面 {panel} 不存在"
"Text {id}: {note}": "文字 {id}：{note}"
"Use a font with vertical glyphs (Source Han Sans / Serif have them), or confirm the punctuation positions are acceptable": "换带竖排字形的字体（思源黑体 / 宋体都带），或确认标点位置可以接受"
"Check the profile's icc.path": "检查配置档 icc.path"
"Fonts {names} have no vertical punctuation glyphs: common punctuation is placed with built-in offsets, take a look on the dieline confirmation image": "字体 {names} 没有竖排标点字形：常用标点按内置的偏移摆，请在刀版确认图上看一眼"
"Placement {id}: vertical text does not support hanging indents yet": "放置 {id}：竖排第一版不支持悬挂缩进"
"Remove --hanging-indent, or set the text horizontally": "去掉 --hanging-indent，或改成横排"
"File not found: {path}": "文件不存在：{path}"
"Check the path (relative to the job folder)": "检查路径（相对 job 目录）"
"The SVG has no printable shapes": "SVG 里没有可印刷的形状"
"Make sure the exported SVG contains filled or stroked shapes": "确认导出的 SVG 含有填充或描边的形状"
"The shapes have zero extent": "形状的范围为 0"
"Check the SVG content": "检查 SVG 内容"
"{name}: {message}": "{name}：{message}"
"Cannot parse the SVG: {error}": "无法解析 SVG：{error}"
"Make sure the file is a valid SVG (export it again from your design software)": "确认文件是有效的 SVG（从设计软件重新导出）"
"Export the SVG again from your design software": "从设计软件重新导出 SVG"
"The SVG uses blend modes": "SVG 里用了混合模式"
"Flatten transparency in your design software, then export again": "在设计软件里拼合透明度后重新导出"
"A shape uses transparency ({value})": "形状用了透明度（{value}）"
"Change it to an opaque solid color (flatten transparency in your design software); print colors must be explicit": "改成不透明的实色（在设计软件里拼合透明度），印刷用的颜色要明确"
"The {paint} of a shape uses a gradient or pattern ({value})": "形状的 {paint} 用了渐变或图案（{value}）"
"Change it to a solid color; for a gradient look, make a bitmap asset and place it with `art add --kind image`": "改成实色；需要渐变效果时做成位图素材，用 `art add --kind image` 放置"
"The fill color has transparency ({value})": "填充色带透明度（{value}）"
"Change it to an opaque solid color": "改成不透明的实色"
"The stroke color has transparency ({value})": "描边色带透明度（{value}）"
"A shape uses a dashed stroke": "形状用了虚线描边"
"Expand the stroke to a shape in your design software (Outline Stroke), then export": "在设计软件里把描边扩展为形状（Outline Stroke / 轮廓化描边）后导出"
"The SVG uses {attr} (clipping path / mask / filter), which the engine cannot reproduce faithfully": "SVG 里用了 {attr}（裁切路径 / 蒙版 / 滤镜），引擎无法如实还原"
"Release clipping masks and expand the appearance in your design software, then export a shapes-only SVG; to clip an image to a shape, use `art add --kind image --clip shape.svg`": "在设计软件里释放剪切蒙版、展开外观，导出为纯形状的 SVG；要把图片裁成形状，用 `art add --kind image --clip 形状.svg`"
"The SVG contains text: text in print files must be outlined": "SVG 里有文字：印刷文件里的文字必须转曲"
"The SVG contains embedded bitmaps": "SVG 里嵌入了位图"
"The SVG contains a foreignObject": "SVG 里有 foreignObject"
"The SVG contains a symbol": "SVG 里有 symbol（符号）"
"Outline the text in your design software (Create Outlines), or delete it and let the engine set it with `art add --kind text`": "在设计软件里把文字转曲（Create Outlines），或删掉文字、改用 `art add --kind text` 由引擎排版"
"Delete the embedded bitmaps: place photos / illustrations separately with `art add --kind image`": "删掉嵌入的位图：照片 / 插图用 `art add --kind image` 单独放置"
"Break the symbol link / expand the symbol (Expand) in your design software, then export again": "在设计软件里断开符号链接 / 展开符号（Expand）后再导出"
"Expand the appearance in your design software (Expand Appearance), then export a shapes-only SVG again": "在设计软件里展开外观（Expand Appearance）后重新导出纯形状的 SVG"
"a simple formula (no ICC, colors are unreliable)": "简单公式（没有 ICC，颜色不可靠）"
"the profile's ICC": "配置档的 ICC"
"Placement {id} uses concept image {name}: concept images cannot go into print files": "放置 {id} 引用了概念图 {name}：概念图不能进入印刷文件"
"Rebuild the final design from the concept: text with `art add --kind text`; trace graphics on the flat as vectors with `restore strip` → `visual trace` (with no flat to trace, use `visual gen` for text-free assets)": "按概念图重建正式设计：文字用 `art add --kind text`；展开平面图上的图形用 `restore strip` → `visual trace` 描成矢量（没有平面图可描时用 `visual gen` 出无文字的素材）"
"{n} colors in vector {id} have no CMYK given and were converted automatically with {how}: {listed}": "矢量图 {id} 有 {n} 种颜色没有指定 CMYK，按{how}自动换算：{listed}"
"Set the ink values from the brand guide / color swatches: `art add ... --colors '{spec}'` (change the numbers to the exact ones), or use --color to print the whole graphic in one color; full illustrations traced with `visual trace --method vtracer` are converted automatically anyway": "按品牌规范 / 色卡指定油墨值：`art add ... --colors '{spec}'`（把数值改成准确的），或用 --color 把整个图形印成一个颜色；整片插画用 `visual trace --method vtracer` 描，颜色本来就自动换算"
"The asset of placement {id} does not exist: {path}": "放置 {id} 的素材不存在：{path}"
"Check the source path (relative to the job folder), or import the asset with `visual import` first": "检查 source 路径（相对 job 目录），或先用 `visual import` 导入素材"
"Placement {id} cannot go into print files: {why}": "放置 {id} 不能进印刷文件：{why}"
"Trace graphics as vectors with `visual trace`; for photos use the user's own shots, or have AI redraw a text-free high-resolution image using this part of the flat as reference": "图形用 `visual trace` 描成矢量；照片用用户实拍，或以平面图这块为参考让 AI 重画成无字的高清图"
"The scope of placement {id} contains unknown panels {unknown}": "放置 {id} 的 scope 含未知面 {unknown}"
"The coordinate transform of placement {id} includes a mirror, which is not supported": "放置 {id} 的坐标变换含镜像，不支持"
"Check the style metadata": "检查盒型元数据"
"{n} colors of illustration {id} were converted to CMYK with a simple formula (no ICC, colors are unreliable)": "插画 {id} 的 {n} 种颜色按简单公式换算成 CMYK（没有 ICC，颜色不可靠）"
"Install a standard ICC (it comes with Adobe software), or put the factory's ICC in the profile's icc.path": "装上标准 ICC（Adobe 软件自带），或在配置档 icc.path 填工厂给的 ICC"
"{share}% of the bleed pixels are filled by stretching the edge": "出血带 {share}% 的像素由边缘拉伸填充"
"For a more natural bleed, supply assets that run into the bleed": "如需更自然的出血，请提供铺满出血边的素材"
"After converting photos to print colors, total ink in {n} dark pixels was capped at the {limit}% limit": "照片转成印刷色后，暗部 {n} 个像素的总墨量压到了上限 {limit}% 以内"
"Nothing to do; if the factory has its own total ink limit, change tac_limit_pct in the profile": "不用处理；工厂对总墨量另有要求时改配置档 tac_limit_pct"
"Cannot read {name}: {error}": "无法读取 {name}：{error}"
"Use PNG or JPEG instead": "换用 PNG 或 JPEG"
"Placement {id}: {message}": "放置 {id}：{message}"
"Vector {id} contains a full-size white shape: it prints as paper white (no ink) and covers the background color and patterns underneath": "矢量图 {id} 里有一个铺满的白色形状：印刷时是纸白（不上墨），会盖住下面的底色和图案"
"If it is just a white background added when the SVG was exported, delete it from the SVG": "如果它只是 SVG 导出时带的白色背景，请在 SVG 里删掉它"
"Add a fallback font to font with a comma, e.g. {font}": "在 font 里用逗号加一个兜底字体，如 {font}"
"Use a font that contains these characters, or add Source Han Sans at the end of the font chain": "换用包含这些字的字体，或在字体链末尾加思源黑体"
"The hanging indent of placement {id} ({indent}mm) is not smaller than the text box width ({width}mm)": "放置 {id} 的悬挂缩进 {indent}mm 不小于文字框宽 {width}mm"
"Reduce --hanging-indent, or widen the text box (--box)": "减小 --hanging-indent，或加宽文字框（--box）"
"Fonts {names} are all missing glyphs: {glyphs} (placement {id})": "字体 {names} 都缺少字形：{glyphs}（放置 {id}）"
