'Show a category''s reference: which panels each kind of information usually goes on, common layouts, regulatory reminders.': 查看一个品类的常规参考：各类信息通常放哪些面、常见版式、法规提醒。
? 'Sign in to the pacxio cloud service: you get an address and a code; sign in in the browser with an email code (the first time creates the account), check the code and approve.


  The token is stored in ~/.pacxio/cloud.json (readable only by you). Running a cloud command while signed out also starts sign-in.'
