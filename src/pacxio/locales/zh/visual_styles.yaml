# 视觉风格包通用读取埋点中文翻译（风格本身的内容与多语言由官网 catalog.json 提供，不写死在此）
"Visual style catalog at {source} is not valid JSON: {error}": "视觉风格目录 {source} 不是合法 JSON：{error}"
"Check the catalog JSON format or pass --design directly without --style": "请检查目录 JSON 格式，或不用 --style 直接传 --design"
"Visual style catalog at {source} is missing the styles list": "视觉风格目录 {source} 缺少 styles 列表"
"Check the catalog JSON schema or pass --design directly without --style": "请检查目录 JSON 结构，或不用 --style 直接传 --design"
"Visual style catalog file not found: {source}": "找不到视觉风格目录文件：{source}"
"Check PACXIO_STYLES_URL, or pass --design directly without --style": "请检查 PACXIO_STYLES_URL 设置，或不用 --style 直接传 --design"
"Could not read visual style catalog {source}: {error}": "读取视觉风格目录 {source} 失败：{error}"
"Check file permissions, or pass --design directly without --style": "请检查文件权限，或不用 --style 直接传 --design"
"Could not refresh visual style catalog from {source} ({reason}); using cached copy": "暂时无法从 {source} 刷新视觉风格目录（{reason}），已使用本地缓存"
"Could not load visual style catalog from {source} ({reason})": "无法从 {source} 加载视觉风格目录（{reason}）"
"Check network access or pacxio.dev/styles availability, set PACXIO_STYLES_URL to a local catalog.json, or pass --design directly without --style": "请检查网络或 pacxio.dev/styles 是否可访问，也可将 PACXIO_STYLES_URL 指向本地 catalog.json，或不用 --style 直接传 --design"
"Visual style catalog at {source} has an invalid structure: {error}": "视觉风格目录 {source} 结构不合法：{error}"
"Run `pacxio concept styles --refresh` once back online to fetch updates": "联网后可运行 `pacxio concept styles --refresh` 获取官网最新风格"
"Unknown visual style {style}": "不认识的视觉风格：{style}"
"Available visual styles: {styles} (run `pacxio concept styles --refresh` to update from pacxio.dev)": "当前目录可选风格：{styles}（运行 `pacxio concept styles --refresh` 可从官网拉取最新风格）"
"Unknown category {category}": "不认识的品类：{category}"
"Available categories: {categories}": "当前目录可选品类：{categories}"
"Provide --design or --style for the main-view concept": "主视角概念图需要提供 --design 或 --style（至少填一项）"
'Describe style, colors, graphics and layout in --design (or pass --style <id> from pacxio.dev/styles)': "请在 --design 中描述风格、配色、图形与版式（或传入从官网 pacxio.dev/styles 复制的 --style <风格 id>）"
"Visual style {style} usually pairs with stocks like {papers}, while this job uses a metallic/holographic substrate": "视觉风格 {style} 通常更搭 {papers} 等纸面，当前项目用的是金属/镭射基材"
"Proceed if you want an intentional contrast, or run `pacxio concept styles --job <job>` to see styles that pair naturally with this paper": "如果刻意想要反差质感可直接继续；也可跑 `pacxio concept styles --job <job>` 查看更贴合当前纸面的风格"

# CLI 帮助与输出
"Browse visual style packs from pacxio.dev/styles (aesthetic direction summaries, not rigid templates), get a contrasting A/B pair by category or paper, or inspect one style.": "读取官网 pacxio.dev/styles 的视觉风格目录（审美方向总结，非固定模板），按品类或纸面获取 A/B 差异推荐，或查看单套详情。"
"Optional visual style id to inspect in detail (omit to list styles)": "可选：查看详情的视觉风格 id（不填则列出目录）"
"Filter by product category id or keyword from the visual style catalog": "按目录里的产品品类 id 或关键词筛选并推荐两套差异方向"
"Optional job folder to rank styles that harmonize with the job's chosen paper stock": "可选：指定 job 目录，优先推荐与当前纸面材质更搭的风格"
"Return full style summaries and group/category metadata": "输出完整风格总结与分组/品类详情"
"Refresh the cached catalog from pacxio.dev/styles instead of using the local cache": "强制从官网 pacxio.dev/styles 刷新目录，跳过本地缓存"
"Optional visual style id from pacxio.dev/styles (aesthetic direction summary; run `pacxio concept styles` to browse)": "可选：官网风格目录中的风格 id（审美方向总结，不做模板强约束；运行 `pacxio concept styles` 浏览）"
"Optional product category from the visual style catalog for shelf-hierarchy nuance": "可选：风格目录里的产品品类，补充货架层级侧重"
"(main) Optional visual style id from pacxio.dev/styles (aesthetic direction summary; makes --design optional)": "（主视角）可选：官网风格目录里的风格 id（作为审美方向总结，填了它 --design 可省略）"
"(main) Optional product category from the visual style catalog for shelf-hierarchy nuance": "（主视角）可选：风格目录里的产品品类，补充货架视觉侧重"
"Optional visual style id recorded in concept metadata (for rebuild hints after choosing)": "可选：记录该概念图使用的视觉风格 id（选定后用于正式稿字体/工艺参考）"
"Optional product category recorded in concept metadata": "可选：记录该概念图对应的产品品类"
"Design description (brand colors, motif, vibe …; optional when --style is given)": "设计描述（品牌色、主图形、气质……；指定 --style 时可省略）"
'Use Pacxio visual style "{id}" ({name}) as the aesthetic direction (adapt freely to my brand rather than using a rigid template) to design packaging and generate main-view concepts.': "用 Pacxio 的视觉风格「{name}」（--style {id}）作为审美方向（不套固定模板，按我的品牌与产品气质自由发挥），帮我设计包装并生成主视角概念图。"
"# Visual style: {style}": "# 视觉风格：{style}"
"# Visual style: {style} (category: {category})": "# 视觉风格：{style}（品类：{category}）"
"  Recommended A/B pair: {a}  vs  {b}": "  推荐 A/B 差异方向：{a}  对比  {b}"
"  {id:<18} [{group}] {name} — {tagline}": "  {id:<18} [{group}] {name} — {tagline}"
"  Categories: {cats}": "  可选品类：{cats}"
"  Aesthetic: {text}": "  审美内核：{text}"
"  Palette: {text}": "  色彩思路：{text}"
"  Typography: {text}": "  字体气质：{text}"
"  Visuals: {text}": "  图形语言：{text}"
"  Avoid: {text}": "  注意避坑：{text}"
"  Restore: {label} — {notes}": "  还原适配：{label} — {notes}"
"  Fonts: {text}": "  推荐字体：{text}"
"  Papers: {papers}  |  Finishes: {finishes}": "  建议纸面：{papers}  |  建议工艺：{finishes}"
"  Starter prompt: {text}": "  起案话术：{text}"
"  Style hints ({name}): {restore} | fonts: {fonts}": "  风格重建参考（{name}）：{restore}｜推荐字体：{fonts}"

