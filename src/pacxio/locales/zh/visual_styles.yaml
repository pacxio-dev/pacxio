"Vector-native (high print fidelity)": "原生矢量友好（高保真还原）"
"Hybrid (separate 300 ppi photo + vector layout)": "图字混合（照片 300ppi 独立出图 + 版面全矢量）"
"Illustrated (300 ppi text-free art + vector copy)": "插画为主（插画 300ppi 无字位图 + 文字全矢量）"
