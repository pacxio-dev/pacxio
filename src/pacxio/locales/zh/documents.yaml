The die-cut outline has a small corner radius of {r} mm (< {min}); the die cannot cut it cleanly / the corner may lift: 模切外形上有半径 {r} mm 的小圆角（< {min}），刀模做不出 / 容易翘角
The die-cut outline has {n} sharp concave corners; the label tears when stripping waste: 模切外形有 {n} 个内凹尖角，排废时会撕标签
The factory profile has not been confirmed by the factory.: 工厂配置档未经工厂确认。
