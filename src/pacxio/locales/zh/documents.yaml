t(" (container size inferred from the label)"): （容器尺寸是按标签推的）
? 't("No standard ICC found on this computer: photos are converted to print colors with a simple formula; the proof is the color reference")'
: 本机没找到标准 ICC：照片按简单公式转成印刷色，颜色以打样为准
? t("Put the barcode in the flatter middle of the pouch; the threshold and the fill model are initial values, not verified; the proof decides")
: 条码放在袋子中间较平的地方；阈值和鼓起模型都是【初值】，以打样为准
uncoated paper: 非涂布纸
up {d}mm: 上移 {d}mm
white film: 白膜
