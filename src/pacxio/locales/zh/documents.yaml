'Surface treatment {id}: panels not found: {panels}': 表面处理 {id} 的面不存在：{panels}
Surface treatments {a} and {b} overlap: 表面处理 {a} 与 {b} 范围重叠
Switch to clear film (pouch_pet_pe_clear etc.) with a white ink base, or confirm the window method with the factory: 换透明膜（pouch_pet_pe_clear 等）+ 白墨打底，或和工厂确认开窗做法
Text: 文字
Text area: 文字区域
? 'Text {id} ({size} pt) is where the film deforms by about {k} when filled (fill {fill}): small text will be distorted by wrinkles and curvature'
: 文字 {id}（{size} pt）在装满后膜要变形约 {k} 的地方（鼓起量 {fill}）：小字会被褶皱和曲面扭曲
'Text {id} is less than {mm} mm from a seal / zipper area: any shift during pouch making will press on it': 文字 {id} 离封口 / 拉链区不到 {mm} mm：制袋时偏位就会压到
Text {id} is {size}pt, smaller than the minimum size {min}pt: 文字 {id} 字号 {size}pt，小于最小字号 {min}pt
Text {id} sets in {n} columns and overflows its box width by {mm}mm: 文字 {id} 排成 {n} 列，宽度超出放置框 {mm}mm
Text {id} sets in {n} lines and overflows its box height by {mm}mm: 文字 {id} 排成 {n} 行，高度超出放置框 {mm}mm
? Text {id} sits in the overlap strip at the start of the wraparound label ({w} mm wide) and will be covered by the other end
: 文字 {id} 压在环标起贴那头的搭接条里（宽 {w} mm），贴上去会被另一头盖住
'Text {id} sits on {kinds}: heat-seal texture and zipper pressing will blur or cut off the text': 文字 {id} 压在{kinds}上：热封压纹、拉链压合会让字看不清或被切掉
