The total ink limit must be within 0–400%: 总墨量上限须在 0–400%
Thicken them to at least {width}mm, or simplify (fine engraving lines, leaf tips in illustrations): 加粗到至少 {width}mm，或简化掉（插画的细刻线、叶尖）
Use SVG (preferred) or a two-tone PNG: 用 SVG（首选）或二值 PNG
