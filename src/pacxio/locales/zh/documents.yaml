: '{name} 里有 {n} 个白色图形没有压在彩色图形上：白色在工艺图里表示不做工艺，这些部分不会做（反白 Logo 的白字就是这样）'
'{name} text area': '{name}文字区域'
'{n} pixels inside the solid areas of plate {spot} are not 100% (likely a gradient or halftone)': '{spot} 版的实地内部有 {n} 个像素不是 100%（疑似渐变或半调）'
