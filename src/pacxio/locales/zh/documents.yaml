Widen the box, reduce the font size / column gap, or shorten the copy: 加宽放置框、减小字号 / 列距或精简文案
Widen the gaps / small white dots to at least {width}mm, or fill them in: 把缝 / 小白点放宽到至少 {width}mm，或填掉
Window (cut out · {film}): 开窗（切掉 · {film}）
? Wraparound label length {w} mm; circumference plus overlap needs {need} mm (container diameter {d}, label calculated for {ld})
: 环标长 {w} mm，容器周长 + 搭接要 {need} mm（容器直径 {d}，标签按 {ld} 算的）
