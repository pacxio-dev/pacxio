The label sits at {z0}–{z1} mm height, outside the labelable band {lo}–{hi} mm (over the shoulder){given}: 标签贴在 {z0}–{z1} mm 高处，超出瓶身可贴段 {lo}–{hi} mm（压到瓶肩）{given}
? 'The material is {what} with no white ink plate: process colors will show through (clear film) or look grey and metallic (metallized)'
: 材料是{what}，没有白墨版：四色印上去会透（透明膜）或发灰带金属色（镀铝）
? 'The material is {what} with no white ink plate: process colors will show through (clear) or look grey and metallic (metallized)'
: 材料是{what}，没有白墨版：四色印上去会透（透明）或发灰带金属色（镀铝）
? The material is {what}; a clear window needs local demetallizing / a window patch with clear film; confirm the process and price with the factory
: 材料是{what}，做透明窗要局部去铝 / 开窗贴透明膜，工艺和价格请工厂确认
'The print PDF has fonts that are not outlined: {fonts}': 印刷 PDF 里有未转曲的字体：{fonts}
