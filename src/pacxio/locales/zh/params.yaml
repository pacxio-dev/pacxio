Handle hole width; default 0.33·Li: 提手孔宽，默认 0.33·Li
Handle panel height; default 0.25·Wi + 30: 手提板高，默认 0.25·Wi + 30
Header card height above the tray; default = W: 头卡高出托盘的高度，默认 = W
Height: 高
Height mm: 高 mm
How deep the diagonal crease is cut near the corner; default 0.0447·Wi + 1.4: 斜压线靠角切开多深，默认 0.0447·Wi + 1.4
Inner side wall end clearance; default t: 侧内壁两端让位，默认 t
Inner side wall end inset; default t: 内侧壁端缩，默认 t
Inner side wall lug length; default 2.5t: 侧内壁插脚长，默认 2.5t
Inner side wall lug root width; receiving hole changes with it: 侧内壁插脚根宽；接收孔同步变化
Inner side wall lug root width; receiving hole follows: 侧内壁插脚根宽，接收孔同步
Inner tuck depth; default min(25, 0.55Hi): 内插舌深，默认 min(25,0.55Hi)
