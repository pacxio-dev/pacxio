Length, front width mm: 长，正面宽 mm
Lid front connecting flap depth: 盖前连接片深
Lid side dust flap depth: 盖侧防尘翼深
Lid side dust flap depth; default min(25, 0.5Hi): 盖侧防尘翼深，默认 min(25,0.5Hi)
Lock head free corner chamfer: 锁头自由角倒角
Lock shoulder flare per side; the head must be wider than the receiving slot: 锁肩单侧外扩，头宽须大于接收槽
Lock tab / front slot assembly allowance: 锁舌 / 前槽装配余量
