Label vertical height mm (along the bottle axis): 标签竖直高度 mm（沿瓶轴量）
Label width mm (diameter for round labels): 标签宽 mm（圆标是直径）
Legacy v1 jobs only; has no effect on the v2 dieline and is not an editable item: 仅兼容旧 v1 job；当前 v2 不参与刀版几何，不作为有效编辑项
Length (front width): 长（正面宽）
Length (front width, the lid hinge side): 长（正面宽，盖的铰链边）
Length (front width, the long side of the opening; the major flaps hang here): 长（正面宽，开口的长边；主翼挂在这边）
