'One-way degassing valve (coffee, fresh tea): centred at the upper front, position marked': 单向排气阀（咖啡、新茶）：正面上部居中，标位置
Outer front apron depth; moves the front panel lock slot height: 外包前片深；联动前板锁槽高度
