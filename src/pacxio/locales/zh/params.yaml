Overlap mm; default from the factory profile labels.wrap_overlap_mm: 搭接 mm，默认配置档 labels.wrap_overlap_mm
Overlap width of the two outer flaps (provisional): 两片外摇盖的重叠宽度【初值】
Paper bridges kept between perforation cuts, also at both ends: 齿刀间保留纸桥，首尾也留桥
'Partial wrap: angle around the bottle; not given = full wrap + overlap': 只包一部分：圆周角；不给 = 整圈 + 搭接
Perforation paper bridge (bridges are also left on both sides of creases): 齿线纸桥（压线两边也留桥）
Pouch height mm (laid flat, seals included): 袋高 mm（成品平放，含封边）
Pouch height mm (top seal included): 袋高 mm（含顶封）
Pouch width mm (laid flat, seals included): 袋宽 mm（成品平放，含封边）
Pull tab overhang on the left of the tear strip: 撕条左侧拉口突出长度
Roll-over width; default 3t+0.5: 卷边宽，默认 3t+0.5
Roll-over width; default 3t+0.5; sets lid width / inner walls: 卷边宽，默认 3t+0.5；联动盖宽 / 内壁
Rounded corners on all four corners: 四角冲圆角
Seal width; if not given, 5 / 7 by pouch width (provisional): 封边宽；不给按袋宽取 5 / 7【初值】
'Seam: back = centre back seal / corner = at the front left corner (quad seal, needs side gussets)': 接缝：back 背中缝 / corner 在正面左角（四边封，要侧风琴）
'Seam: back = centre back seal / corner = at the front left corner (true eight-side seal, plain back)': 接缝：back 背中缝 / corner 在正面左角（真八边封，背面整面）
