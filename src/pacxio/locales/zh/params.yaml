# Box style parameter descriptions (Field(description=...)); translated at output time.
Adhesive flap depth left on the front panel; default glue width + glue margins on both sides: 留在前板的粘接片深，默认胶宽+两侧胶边距
Adhesive strip distance from the perforation / free edge of the adhesive flap: 胶条离齿线 / 粘接片自由边距离
Adhesive strip end inset; sets the front panel ink-free receiving area: 胶条两端缩进，联动前板禁墨接收区
Adhesive strip width, on the back of the adhesive flap: 胶条宽，位于粘接片纸背
Angle between the roof panel and horizontal: 屋顶板和水平面的夹角
Back centre seal width (each side); default 10 (provisional): 背中缝封宽（每边），默认 10【初值】
Base depth: 底板深
Base length (front width): 底板长（正面宽）
Base receiving hole depth; sets the interrupted base crease: 底板接收孔深；联动断开的底板压线
Body height (without roof and handle panel): 盒身高（不含屋顶和手提板）
Bottle diameter mm (label width = π·L + overlap): 瓶身直径 mm（标签宽 = π·L + 搭接）
Bottle diameter mm at the label's bottom edge: 标签下沿处的瓶身直径 mm
Bottle diameter mm at the label's top edge: 标签上沿处的瓶身直径 mm
Bottom depth mm (= unfolded side gusset width); 0 = 0.4 × front width: 底深 mm（= 侧风琴面展开宽）；0 = 按 0.4 × 正面宽
Bottom gusset / side gusset depth mm; 0 = derived from pouch width (stand-up) or none (back seal): 底褶 / 侧风琴深 mm；0 = 按袋宽推（自立袋）或没有（背封袋）
Bottom panel four-side seal width; default 6 (provisional): 底片四边封宽，默认 6【初值】
Boundary between the glued web triangle and the panel: 糊胶三角离面的分界
CLI compatibility placeholder; not used in the dieline: CLI 兼容占位；不参与刀线
CLI compatibility placeholder; not used in the flat structure (board thickness comes from the material): CLI 兼容占位；不参与平面结构，纸厚来自材料
Centre distance between the two lock tabs; the receiving slots move with it: 两枚锁舌中心距；接收槽同步移动
Centre seal width (each side); default 9 (provisional): 中缝封宽（每边），默认 9【初值】
Clear window rect / oval (front, position marked): 透明窗 rect / oval（正面，标位置）
Clearance between lid side and the inner edge of the roll-over: 盖侧与卷边内沿让位
Clearance between the back of the apron and the front panel: 外包片纸背与前板的间距
Clearance between the tuck and the back of the front wall; sets lid depth: 插舌与前壁纸背的间距；联动盖深
Corner radius; round_rect default 3: 圆角，round_rect 默认 3
'Custom outline: one closed outline as SVG, Béziers become arcs; as seen from the front': 异形外形：单条闭合轮廓 SVG，贝塞尔转圆弧；正面看的样子
Depth in the pull direction: 抽拉方向的深
Depth of the side wall lug receiving hole (not the front lock slot): 侧壁插脚接收孔深，非前锁槽
Drawer front width (left to right): 抽屉脸宽（左右）
Dust flap end bevel: 防尘翼端斜角
Dust flap end bevel, degrees: 防尘翼两端斜角，度
Dust flap free corner radius: 防尘翼自由角半径
Ear distance from the base crease; default 3: 夹耳离底板压线距离，默认 3
