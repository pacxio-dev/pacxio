Flat height mm: 展开高 mm
Flat width mm: 展开宽 mm
Four vertical corner seals (quad seal; the pouch stands up straighter): 四条竖角封（立体边封，袋子立得更挺）
Front panel cut-out depth; default 0.35·H; 0 = no cut-out: 前板缺口深，默认 0.35·H；0 = 不挖
Front panel cut-out width; default 0.6·L: 前板缺口宽，默认 0.6·L
Front width mm: 正面宽 mm
