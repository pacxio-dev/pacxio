Tear strip width (distance between the two perforation lines): 撕拉条宽（两条齿线间距）
'Tear strip: two perforation lines around the body plus a pull tab': 撕拉条：盒身一圈两条齿线 + 起撕口
Tear-off strip width; the actual perforation lines on both sides follow: 可撕条宽，两侧实际齿线联动
Thumb notch width (half-circle diameter): 手指缺口宽（半圆直径）
'Thumb notch: a half-round notch in the top edge of the front when the tuck is at the top': 手指缺口：插舌顶时正面上沿的半圆缺口
Top and bottom seal width; default 12 (provisional): 上下封宽，默认 12【初值】
Top seal width; default 10 (provisional): 顶封宽，默认 10【初值】
Total lock tab length: 锁舌总长
Tray wall height: 托盘壁高
Tuck free corner radius (a real cut-line parameter): 插舌自由角圆角；真实刀线参数
Tuck inset from the lid sides: 插舌两侧相对盖侧缩进
Width (depth): 宽（进深）
Width (front-to-back depth): 宽（前后进深）
Width (short side of the opening, side width): 宽（开口的短边，侧面宽）
Width (side width): 宽（侧面宽）
Width (side width; the roof slopes up from front and back to the middle): 宽（侧面宽；屋顶从前后两边向中间斜上）
Width, front-to-back depth mm: 宽，前后进深 mm
Window centre above the pouch bottom; default 0.42 × pouch height: 窗中心离袋底，默认 0.42 × 袋高
Window height; default 0.3 × pouch height: 窗高，默认 0.3 × 袋高
Window width; default 0.45 × pouch width: 窗宽，默认 0.45 × 袋宽
Zipper (13–25 mm from the top, provisional): 拉链（离顶 13–25 mm【初值】）
Zipper (13–25 mm from the top, provisional); not given = none with a spout, otherwise yes: 拉链（离顶 13–25 mm【初值】）；不给 = 有吸嘴时没有，否则有
'custom outline: one closed outline as SVG; Béziers become arcs': custom 外形：单条闭合轮廓 SVG，贝塞尔转圆弧
'custom shape: outline_svg gives the outline': custom 异形：outline_svg 给外形
pouch = finished pouches / roll = roll stock (formed on a packing machine, with eye marks): pouch 成品袋 / roll 卷膜（自动包装机制袋，带光标）
