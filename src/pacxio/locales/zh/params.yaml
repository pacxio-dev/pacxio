Sleeve inside clear width: 套内净宽
Slot width between top flaps; default max(3, 2t): 顶摇盖之间的槽宽，默认 max(3, 2t)
Spout diameter; default 10 (provisional): 吸嘴口径，默认 10【初值】
'Spout: top = top centre / corner = top-right angled corner (jelly, juice, sauce)': 吸嘴：top 顶部居中 / corner 右上斜角（果冻、果汁、酱料）
Step at the centre of the major flap; default min(4, 0.32·(major flap depth − Ws/2)): 主翼正中台阶，默认 min(4, 0.32·(主翼深 − Ws/2))
