# 3D 效果图汇总页、平铺确认页（交付件语言，见工厂配置档 document_language）
"Must fix": "必须解决"
"Attention": "注意"
"Mockups are illustrations and cannot replace a physical proof. Get a proof approved before mass production.": "效果图是示意，不能替代打样。批量生产前须打样确认。"
"(Source Han Sans not found, so Chinese text cannot be shown: run `pacxio setup --yes` or {command} first)": "（没有找到思源黑体，中文无法显示：请先运行 `pacxio setup --yes` 或 {command}）"
"{label} (AI direction reference)": "{label}（AI 方向参考）"
"Design direction comparison": "设计方向对照"
"Exact mockup · {view} (what will be printed)": "精确效果图 · {view}（最终会印出来的内容）"
"The two will differ: the proportions, text, fonts and details in the concept image are drawn by AI, and the final files are rebuilt from it. Go by the exact mockup on the right, and confirm these differences are acceptable.": "两者会有差别：概念图里的比例、文字、字体、细节都是 AI 画的，正式文件按它重建；请以右边的精确效果图为准，并确认这些差别可以接受。"
"3D views": "三维效果"
"Content checklist (what is on each panel)": "信息清单（每个面上有什么）"
"Background: {items}": "背景：{items}"
"(No text / images / finishes, only a background color or pattern)": "（没有文字 / 图片 / 工艺，只有底色或图案）"
"Image": "图片"
"Graphic": "图形"
"Placeholder": "占位"
"Finish": "工艺"
"[{tag}] {summary} ({panel})": "[{tag}] {summary}（{panel}）"
"Content on panels you cannot see (tuck flaps / dust flaps / glue flap): {items}": "看不到的面（插舌 / 防尘翼 / 糊口）上的内容：{items}"
"Tags used: {tags}": "出现过的信息标签：{tags}"
"Tags used: (none)": "出现过的信息标签：（没有标注任何标签）"
"Check before confirming": "确认前要看的事项"
"{name}  parts {parts} (each part folded and laid side by side; how they assemble is not drawn)": "{name}  部件 {parts}（各件折好并排摆，组装关系未画）"
"{name} ({style})  closed outer size {l} x {w} x {h} mm  material {material}  parts {parts}": "{name}（{style}）  合上外尺寸 {l} x {w} x {h} mm  材料 {material}  部件 {parts}"
"{name} ({style})  flat {w} x {h} mm  material {material}; the bottle is for display only": "{name}（{style}）  展开 {w} x {h} mm  材料 {material}；瓶子只作展示"
"{name} ({style})  pouch {w} x {h} mm  material {material}; filled shape approximated with a bulge of {fill} (initial value, not verified); bottom left is laid flat": "{name}（{style}）  袋 {w} x {h} mm  材料 {material}；装满按鼓起量 {fill}【初值】近似，左下是平放"
"{name} ({style})  flat {w} x {h} mm  caliper {caliper} mm; H is a compatibility placeholder": "{name}（{style}）  展开 {w} x {h} mm  纸厚 {caliper} mm；H 为兼容占位"
"{name} ({style})  inner size {l} x {w} x {h} mm  material {material}  flat {fw} x {fh} mm": "{name}（{style}）  内尺寸 {l} x {w} x {h} mm  材料 {material}  展开 {fw} x {fh} mm"
"Static finish illustration  {job} (fixed highlights; see the workbench 3D for the interactive view)": "静态工艺示意图  {job}（高光固定；交互效果见工作台 3D）"
"Chosen concept image {id}": "选定的概念图 {id}"
"Back view concept image {id}": "背面视角概念图 {id}"
"Open (mailer box; inside of the lid is unprinted board)": "打开（飞机盒，盖内为未印刷纸背）"
"Confirming the flat layout is only a record; confirming the exact 3D mockup (approve) is the formal confirmation before export. Get a proof approved before mass production.": "平铺确认只是记录；3D 精确效果图确认（approve）才是导出前的正式确认。批量生产前须打样确认。"
"Cannot compare flat concept {id}: {error}": "展开平面图 {id} 没法对照：{error}"
"Check the faces it is tagged with in `concept list`, or run `concept rectify {directory} {id}` to see what was measured": "检查 `concept list` 里它标的面；或 `concept rectify {directory} {id}` 看量出的结果"
"No fold lines between faces found in flat concept {id}; it was cut by the real width ratio": "展开平面图 {id} 里没找到面与面之间的折线，按真实宽度比例切开"
"If the AI drew the faces at unequal widths the cut will be off, so keep that in mind when comparing; when regenerating, ask for a thin fold line running top to bottom": "AI 把两面画得不等宽时会切偏，对照时注意；重出时要求画一条贯穿上下的细折线"
"{face} (= {other})": "{face}（= {other}）"
"{face} in {concept}": "{concept} 里的{face}"
"{label}: taken from {src}; the original aspect ratio differs from the real one by {error} (straightened to real size)": "{label}：取自 {src}，原图比例和真实差 {error}（已按真实尺寸拉正）"
"{note}; no fold line found, cut by proportion": "{note}；没找到折线，按比例切开"
"Comparison with the flat concept (flat against flat)": "和展开平面图对照（平面对平面）"
"Left: the AI flat concept, straightened to real size (its AI-drawn text is for reference only); middle: the final artwork (what will be printed); right: both overlaid at 50%, where they do not line up is the difference.": "左：AI 展开平面图，按真实尺寸拉正（带 AI 写的字，只作参考）；中：正式稿（会印出来的内容）；右：两者 50% 叠在一起，错开的地方就是差别。"
"AI flat (straightened)": "AI 平面图（拉正）"
"Final artwork": "正式稿"
"Overlay 50%": "叠图 50%"
"Faces without a flat concept: {faces}": "没有展开平面图的面：{faces}"
"AI flat (straightened) · {concept}": "AI 平面图（拉正）· {concept}"
"Flat layout (printed side as seen from outside the box, with dieline)": "展开图（从盒外看的印刷面，含刀线）"
"Comparison with the chosen concept image (main view)": "和选定的概念图对照（主视角）"
"Chosen concept image (direction reference, not print content)": "选定的概念图（方向参考，不是印刷内容）"
"Final artwork: front + right side (what will be printed)": "正式稿：正面 + 右侧面（会印出来的内容）"
"(No concept image chosen yet)": "（还没有选定概念图）"
