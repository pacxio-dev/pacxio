"# Rebuild the final artwork from these views: vectorize illustrations, colour blocks and contours with `restore strip` then `visual trace --lines`. Remove AI-drawn text and typeset it in pacxio. Use hand-drawn SVG for simple icons when it gives a cleaner result (references/vector.md).": "# 正式稿照这组平面图还原：插画、色块、等高线用 `restore strip` → `visual trace --lines` 描成矢量，AI 画的字去掉、由引擎重排；简单图标手写 SVG 更干净时用手写（references/vector.md）。"
"# Use the aspect ratio and resolution above if the image tool supports them, or follow the first line of the prompt below. After import, a canvas ratio off by more than 10% requires regeneration; individual panel differences are warnings. Try at most two rounds, then ask the user how to proceed.": "# 出图工具能指定比例和分辨率时用上面两行（接口的预设比例一定照给）；不能时照提示词第一行。导入后引擎量整张比例：差超过 10% 标「要重出」，单面偏差只提醒。同一组最多出两轮，还不过就停下问用户。"
