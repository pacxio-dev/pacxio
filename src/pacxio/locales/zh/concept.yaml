"# Generate one new image with the prompt below and attach the listed reference images.\n#   Run the import command after generation. --codex-latest imports the latest existing image; it does not generate one.\n#   Identical images are rejected (DUPLICATE). Tell the user how many images you will generate first.": "# 先出图、再导入：用 image_gen（如 Codex 内置出图）按空行之后的英文提示词出 1 张新图（附下面的输入图），\n#   出图完成后再运行导入命令。只运行导入命令不会出图：--codex-latest 取的是出图目录里最新的一张，\n#   和已有概念图完全相同的图会被拒绝（DUPLICATE）。出图前告诉用户这次要出几张。"
